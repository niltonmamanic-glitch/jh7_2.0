<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        {% block title %}JH7 Telecom{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/jh7.css') }}"
    >
</head>

<body>

    <!-- Encabezado principal -->
    <header class="top">

        <!-- Logotipo -->
        <a href="/">
            <img
                src="{{ url_for('static', filename='img/logo_jh7.jpg') }}"
                alt="JH7 Telecom"
                class="logo"
            >
        </a>

        <!-- Menú de navegación -->
        <nav>

            <a href="/">Inicio</a>

            {% if current_user.is_authenticated %}

                <a href="/panel">Panel</a>

                <a href="/reportes">Reportes</a>

                <a href="/asistente">IA Diagnóstico</a>

                <a href="/logout/">Cerrar sesión</a>

            {% else %}

                <a class="btn" href="/login/">
                    Iniciar sesión
                </a>

            {% endif %}

        </nav>

    </header>

    <!-- Contenido de cada página -->
    <div class="shell">

        {% block body %}
        {% endblock %}

    </div>

    <!-- Pie de página -->
    <footer>
        JH7 SRL TELECOM 2.0 · Conectamos personas, acercamos soluciones
    </footer>

</body>

</html>
